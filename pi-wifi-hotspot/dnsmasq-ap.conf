# DHCP untuk klien hotspot WIFI-gratis (wlan2). Subnet beda dari CCTV-AUDIT
# (10.20.30.0/24) supaya tak bentrok kalau suatu saat dipakai gantian.
interface=wlan2
bind-interfaces
except-interface=wlan0
listen-address=10.20.50.1
dhcp-range=10.20.50.50,10.20.50.150,255.255.255.0,12h
dhcp-option=3,10.20.50.1
dhcp-option=6,10.20.50.1
domain-needed
bogus-priv
log-dhcp
log-facility=/var/log/hotspot-dnsmasq.log
log-async=5
