syntax = "proto3";

package device.v1;

option go_package = "github.com/warungbudina/akses-vps/grpc-server/proto/gen;devicev1";

// DeviceService — jembatan antara sistem eksternal dan GenieACS/MQTT.
// Endpoint yang benar-benar menyentuh GenieACS/Mongo dijaga JWT + API key
// internal, ditegakkan lewat interceptor (lihat internal/middleware/auth.go).
service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDevice(GetDeviceRequest) returns (Device);
  rpc PublishCommand(PublishCommandRequest) returns (PublishCommandResponse);

  // Dipanggil oleh FreeRADIUS (rlm_rest) saat Accounting-Start/Stop dari
  // accel-ppp di PoP, untuk mengorelasikan sesi pelanggan dengan device
  // GenieACS. Lihat docs/13-accel-ppp-integration.md.
  rpc LinkSubscriberSession(LinkSubscriberSessionRequest) returns (LinkSubscriberSessionResponse);
}

message ListDevicesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListDevicesResponse {
  repeated Device devices = 1;
  string next_page_token = 2;
}

message GetDeviceRequest {
  string device_id = 1;
}

message Device {
  string device_id = 1;
  string serial_number = 2;
  string manufacturer = 3;
  string product_class = 4;
  int64 last_inform_unix = 5;
  string status = 6;
}

message PublishCommandRequest {
  string device_id = 1;
  string topic = 2;
  bytes payload = 3;
}

message PublishCommandResponse {
  bool accepted = 1;
}

message LinkSubscriberSessionRequest {
  string radius_username = 1;
  string calling_station_id = 2; // MAC address CPE dari RADIUS
  string framed_ip_address = 3;
  string pop = 4;
  string event_type = 5; // "start" | "stop" | "interim-update"
}

message LinkSubscriberSessionResponse {
  bool linked = 1;
  string device_id = 2; // GenieACS device _id yang cocok, kosong jika tidak ditemukan
}
