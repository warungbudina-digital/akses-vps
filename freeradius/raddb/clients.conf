# Satu entri per PoP accel-ppp — dibatasi ke IP WireGuard masing-masing,
# JANGAN gunakan 0.0.0.0/0. Tambahkan blok baru setiap ada PoP baru.
# Lihat docs/13-accel-ppp-integration.md untuk alur lengkap.

client pop1 {
    ipaddr     = 10.66.66.10
    secret     = CHANGE_ME_PER_POP_SECRET
    require_message_authenticator = yes
    nas_type   = other
}

