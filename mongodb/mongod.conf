storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.5   # sesuaikan ~50% RAM limit container, sisakan untuk OS/connections

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen

net:
  port: 27017
  bindIp: 0.0.0.0   # aman karena mongodb hanya reachable dari data-net (tidak ada publish port ke host)
  maxIncomingConnections: 500
  tls:
    mode: disabled   # aktifkan 'requireTLS' jika trafik antar-host (bukan localhost/docker network)

security:
  authorization: enabled
  javascriptEnabled: false

operationProfiling:
  slowOpThresholdMs: 200
  mode: slowOp

setParameter:
  enableLocalhostAuthBypass: false
