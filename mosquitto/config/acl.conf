# Format: user <username> lalu topic [read|write|readwrite] <pattern>
# Prinsip: default deny, setiap user hanya boleh akses topic yang relevan.

# grpc-server: publish event device, subscribe command downstream
user grpc-service
topic write acs/events/#
topic read  acs/commands/#

# genieacs bridge (opsional, jika ada integrasi custom TR-069<->MQTT)
user genieacs-service
topic readwrite acs/genieacs/#

# Device/agent lapangan: hanya boleh publish ke topic milik device sendiri
# (pattern %c = client_id, sebaiknya client_id = device serial number)
pattern write acs/events/%c/#
pattern read  acs/commands/%c/#

# Admin/dashboard read-only untuk monitoring topic
user monitor
topic read #
