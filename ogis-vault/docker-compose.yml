services:
  # ────────────────────────────────────────────
  # Ollama — nomic-embed-text, khusus embedding vektor ogis-vault.
  # TERPISAH dari stack ~/browser (dipakai bersama .60) sengaja — supaya
  # .60 (yang tak butuh RAG) tak ikut menanggung service ini.
  # ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ogis-vault-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m

volumes:
  ollama-data:
