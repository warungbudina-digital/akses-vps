# =====================================================================
# REFERENCE ONLY — menggambarkan dependency graph & konfigurasi service.
# Deployment akhir ke MikroTik CHR dilakukan per-container lewat
# `/container add` (lihat mikrotik/routeros-chr.rsc) KARENA RouterOS
# Container tidak punya orchestrator Compose native.
#
# File ini tetap berguna untuk:
#   - development lokal (docker compose up)
#   - dijalankan di VPS host langsung (topologi alternatif, lihat
#     docs/11-deployment-recommendations.md) dengan CHR hanya sebagai
#     router/firewall edge di depan host Docker.
# =====================================================================
version: "3.9"

networks:
  edge-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: false
  data-net:
    driver: bridge
    internal: true   # tidak ada route keluar ke internet dari network ini
  obs-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  letsencrypt-certs:
  letsencrypt-www:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # -------------------- Edge --------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [edge-net, app-net]
    ports:
      - "80:80"
      - "443:443"
      - "7547:7547"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt-certs:/etc/letsencrypt:ro
      - letsencrypt-www:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - grpc-server
      - genieacs-ui
      - genieacs-cwmp
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    networks: [edge-net]
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - letsencrypt-www:/var/www/certbot
      - ./certbot/renew-hook.sh:/renew-hook.sh:ro
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --deploy-hook /renew-hook.sh;
      sleep 12h & wait $${!}; done"

  # -------------------- Application --------------------
  grpc-server:
    build: ./grpc-server
    restart: unless-stopped
    networks: [app-net, data-net, obs-net]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    env_file: [.env]
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8443"
      REDIS_ADDR: "redis:6379"
      MONGO_URI: "mongodb://grpc_readonly:${GRPC_MONGO_PASSWORD}@mongodb:27017/genieacs?authSource=genieacs"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
    healthcheck:
      test: ["CMD", "/app/grpc-server", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on: [mongodb, redis, mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks: [app-net, obs-net]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - letsencrypt-certs:/mosquitto/certs:ro
    security_opt: ["no-new-privileges:true"]

  genieacs-cwmp:
    image: genieacs/genieacs:1.2-slim
    command: ["genieacs-cwmp"]
    restart: unless-stopped
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on: [mongodb, redis]

  genieacs-nbi:
    image: genieacs/genieacs:1.2-slim
    command: ["genieacs-nbi"]
    restart: unless-stopped
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on: [mongodb, redis]

  genieacs-fs:
    image: genieacs/genieacs:1.2-slim
    command: ["genieacs-fs"]
    restart: unless-stopped
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on: [mongodb]

  genieacs-ui:
    image: genieacs/genieacs:1.2-slim
    command: ["genieacs-ui"]
    restart: unless-stopped
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on: [genieacs-nbi]

  # -------------------- Data --------------------
  mongodb:
    image: mongo:7
    restart: unless-stopped
    networks: [data-net, obs-net]
    command: ["--config", "/etc/mongod.conf"]
    volumes:
      - ./mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      GENIEACS_MONGO_USER: ${GENIEACS_MONGO_USER}
      GENIEACS_MONGO_PASSWORD: ${GENIEACS_MONGO_PASSWORD}
      GRPC_MONGO_USER: grpc_readonly
      GRPC_MONGO_PASSWORD: ${GRPC_MONGO_PASSWORD}
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [data-net, obs-net]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    security_opt: ["no-new-privileges:true"]

  # -------------------- Observability --------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    networks: [app-net, obs-net]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    networks: [app-net, obs-net]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    networks: [obs-net]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    networks: [obs-net]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
