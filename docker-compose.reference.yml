# =====================================================================
# File compose yang benar-benar dipakai (bukan cuma referensi) — dijalankan
# langsung di host VPS Linux lewat `docker compose -f
# docker-compose.reference.yml up -d` (atau `deploy.sh`), tanpa MikroTik
# CHR/RouterOS di jalur manapun. Firewall/NAT edge ditangani UFW di host +
# Cloudflare Tunnel (lihat docs/01, docs/11).
#
# Nama file dipertahankan "reference" karena juga dipakai sebagai
# dependency graph/dokumentasi arsitektur (docs/05), bukan berarti isinya
# sekadar contoh yang tidak dijalankan sungguhan.
# =====================================================================
networks:
  edge-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: false
  data-net:
    driver: bridge
    internal: true   # tidak ada route keluar ke internet dari network ini
  obs-net:
    driver: bridge
  # radius-db + freeradius only. NOT internal:true - freeradius must accept
  # inbound RADIUS from real PoPs over WireGuard, and empirically (tested
  # live 2026-07-08) Docker's port-publishing DNAT does not work AT ALL for
  # any container whose only network is internal:true (host-side publish
  # silently no-ops - confirmed via `ss -tlnp`/`docker port` showing
  # nothing despite HostConfig.PortBindings looking correct). So this
  # network can't be internal like data-net is. Trade-off: unlike
  # mongodb/redis on data-net, a compromised radius-db here is not
  # structurally prevented from reaching the internet - accepted for now
  # since freeradius (same segment) already needs real outbound access
  # (WireGuard-tunneled RADIUS to PoPs), revisit with a scoped egress
  # firewall rule if this needs hardening further.
  radius-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  prometheus-data:
  grafana-data:
  loki-data:
  radius-db-data:

services:
  # -------------------- Edge --------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.3
    networks: [edge-net, app-net]
    ports:
      # 80/443 sengaja TIDAK di-publish lagi ke host - satu-satunya jalur
      # publik untuk service di belakang nginx sekarang cloudflared (lihat
      # service di bawah), yang menyambung ke sini via nama Docker network,
      # bukan port host. 7547 tetap publik langsung untuk CPE yang tidak
      # support SNI/TLS modern (lihat docs/04-tr069-request-flow.md).
      - "7547:7547"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/dashboards:/usr/share/nginx/dashboards:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - grpc-server
      - genieacs-ui
      - genieacs-cwmp
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  cloudflared:
    # Satu-satunya jalur publik ke nginx untuk 80/443 - hanya bikin koneksi
    # keluar (outbound) ke edge Cloudflare, tidak ada port yang perlu
    # di-publish/dst-nat sama sekali untuk service ini. TLS publik
    # (acs/cwmp/fs/api.obc-crypto.com) ditangani sepenuhnya oleh Cloudflare
    # edge - menggantikan certbot/Let's Encrypt yang sebelumnya dipakai di
    # sini. Tunnel + ingress rule dikonfigurasi lewat Cloudflare API/dashboard,
    # bukan file ini - token-nya saja yang di-mount lewat env.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    networks: [edge-net, app-net]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    security_opt: ["no-new-privileges:true"]
    depends_on: [nginx]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  cloudflared-n8n:
    # (2026-08-25) Tunnel TERPISAH dari cloudflared di atas -- khusus
    # n8n.obc-crypto.com, proxy LANGSUNG ke n8n-uploader di VM Cloud Shell
    # gogobuda (10.66.66.61:5678 via WireGuard), BUKAN lewat nginx (beda host,
    # bukan container lokal di stack ini). Ingress rule dikonfigurasi lewat
    # Cloudflare API (tunnel id 9505b522-..., nama tunnel "n8n" -- reuse
    # tunnel lama yg sempat dibuat 6 Juni 2026, ingress-nya diupdate dari
    # target basi "n8n-n8n-1:5678" ke IP WG yg benar). Auth publik ditangani
    # n8n sendiri (N8N_BASIC_AUTH_ACTIVE=true), bukan di layer tunnel ini.
    # network_mode host TIDAK dipakai -- default bridge cukup, container bisa
    # reach 10.66.66.61 lewat NAT egress host (terverifikasi live 25/8).
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_N8N_TUNNEL_TOKEN}"
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # -------------------- Application --------------------
  grpc-server:
    build: ./grpc-server
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.3
    networks: [app-net, data-net, obs-net]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    env_file: [.env]
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8443"
      REDIS_ADDR: "redis:6379"
      MONGO_URI: "mongodb://grpc_readonly:${GRPC_MONGO_PASSWORD}@mongodb:27017/genieacs?authSource=genieacs"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      MQTT_USERNAME: "grpc-service"
      MQTT_PASSWORD: "${MQTT_PASSWORD}"
    healthcheck:
      test: ["CMD", "/app/grpc-server", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on: [mongodb, redis, mosquitto]

  # Kanal kontrol fleet pentest (Raspberry Pi dkk) - terpisah sepenuhnya dari
  # grpc-server di atas (domain GenieACS/TR-069, jangan dicampur). Tidak
  # butuh mongodb/redis/genieacs, jadi cuma app-net+obs-net (bukan data-net).
  pentest-grpc-server:
    build: ./pentest-grpc-server
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    networks: [app-net, obs-net]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    env_file: [.env]
    environment:
      GRPC_PORT: "50052"
      HTTP_PORT: "8444"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      MQTT_USERNAME: "pentest-service"
      MQTT_PASSWORD: "${PENTEST_MQTT_SERVICE_PASSWORD}"
    healthcheck:
      test: ["CMD", "/app/pentest-grpc-server", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on: [mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    mem_limit: 48m
    cpus: 0.2
    networks: [app-net, obs-net]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    security_opt: ["no-new-privileges:true"]

  genieacs-cwmp:
    build: ./genieacs
    command: ["genieacs-cwmp"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.8
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [mongodb, redis]

  genieacs-nbi:
    build: ./genieacs
    command: ["genieacs-nbi"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [mongodb, redis]

  genieacs-fs:
    build: ./genieacs
    command: ["genieacs-fs"]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.2
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [mongodb]

  genieacs-ui:
    build: ./genieacs
    command: ["genieacs-ui"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    networks: [app-net, data-net, obs-net]
    env_file: [genieacs/genieacs.env]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [genieacs-nbi]

  # -------------------- Data --------------------
  mongodb:
    image: mongo:7
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.8
    networks: [data-net, obs-net]
    command: ["--config", "/etc/mongod.conf"]
    volumes:
      - ./mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      GENIEACS_MONGO_USER: ${GENIEACS_MONGO_USER}
      GENIEACS_MONGO_PASSWORD: ${GENIEACS_MONGO_PASSWORD}
      GRPC_MONGO_USER: grpc_readonly
      GRPC_MONGO_PASSWORD: ${GRPC_MONGO_PASSWORD}
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.2
    networks: [data-net, obs-net]
    # maxmemory diset di bawah mem_limit container (96m) supaya Redis evict
    # graceful (allkeys-lru) sebelum kena hard OOM-kill oleh cgroup - sudah
    # direkomendasikan di docs/11 tapi belum pernah benar-benar di-wire ke sini.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "80mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    security_opt: ["no-new-privileges:true"]

  # -------------------- AAA (accel-ppp integration, lihat docs/13) --------------------
  radius-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.3
    networks: [radius-net]   # see radius-net's comment above for why not data-net
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: ${RADIUS_DB_PASSWORD}
    volumes:
      - radius-db-data:/var/lib/postgresql/data
      - ./freeradius/postgres-init:/docker-entrypoint-initdb.d:ro
    security_opt: ["no-new-privileges:true"]

  freeradius:
    # NOTE: ":3.2" alone is not a published tag on this image (only
    # 3.2.0..3.2.10 or "latest-3.2" exist) - pin to a real one, per the
    # "pin every image" policy in docs/11-deployment-recommendations.md.
    image: freeradius/freeradius-server:3.2.10
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.3
    # NOT network_mode: host (deviates from the original docs/13 design -
    # see below). Reaches radius-db via normal Docker DNS on radius-net;
    # its own RADIUS ports are published bound to the WireGuard host IP
    # specifically (10.66.66.1), not host networking wholesale. This also
    # sidesteps host networking's own problem: it would put freeradius in
    # the host netns with NO Docker DNS at all, unable to resolve
    # "radius-db" by name (this is what the old 127.0.0.1-publish hack on
    # radius-db was working around, before discovering that approach is
    # dead anyway per radius-net's comment above).
    # Also on app-net (same as grpc-server) so rlm_rest can reach
    # "grpc-server:8443/v1/radius/accounting" by Docker DNS - radius-net
    # alone doesn't overlap with any network grpc-server is on.
    networks: [radius-net, app-net]
    ports:
      - "10.66.66.1:1812:1812/udp"   # RADIUS auth
      - "10.66.66.1:1813:1813/udp"   # RADIUS accounting
    env_file: [.env]   # RADIUS_DB_PASSWORD + INTERNAL_API_KEY, read via $ENV{} in module configs - never written in plaintext to a tracked config file
    volumes:
      # NOTE: mount at /etc/freeradius, NOT /etc/raddb. /etc/raddb inside
      # this image is only a symlink to /etc/freeradius kept for CLI-tool
      # convenience - radiusd.conf's own compiled-in confdir is
      # /etc/freeradius, so mounting at the symlink path gets silently
      # shadowed/ignored by the running daemon (verified via `docker run
      # --entrypoint cat ... /docker-entrypoint.sh` + radiusd.conf's
      # `raddbdir = /etc/freeradius`).
      - ./freeradius/raddb:/etc/freeradius:ro
    depends_on: [radius-db, grpc-server]

  # -------------------- Observability --------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    networks: [app-net, obs-net]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    networks: [app-net, obs-net]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    profiles: ["monitoring"]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.3
    networks: [obs-net]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    profiles: ["monitoring"]

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    networks: [obs-net]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    profiles: ["monitoring"]
