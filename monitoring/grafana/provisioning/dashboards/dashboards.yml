apiVersion: 1

providers:
  - name: "akses-vps"
    orgId: 1
    folder: "Akses VPS"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

# Letakkan file dashboard JSON (export dari Grafana UI) di:
#   monitoring/grafana/provisioning/dashboards/json/
# Dashboard yang disarankan dibuat:
#   - "System Overview": CPU/RAM/Network per container (dari cadvisor+node-exporter)
#   - "GenieACS": inform rate, active devices, task queue length, fault rate
#   - "gRPC Server": request rate, p50/p95/p99 latency, error rate
#   - "MongoDB": ops/sec, connections, replication lag (jika replica set)
#   - "MQTT": connected clients, message rate in/out, retained messages
