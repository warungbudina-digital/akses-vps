# Grafana — https://grafana.domain.com
server {
    listen 80;
    listen [::]:80;
    server_name grafana.domain.com prometheus.domain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.domain.com;

    ssl_certificate     /etc/letsencrypt/live/grafana.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.domain.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/grafana.access.log json_combined;
    error_log  /var/log/nginx/grafana.error.log warn;

    # Batasi akses dashboard monitoring hanya dari IP admin (defense in depth
    # selain login Grafana sendiri)
    allow 203.0.113.10/32;   # GANTI dengan IP admin/VPN
    deny all;

    limit_req zone=general_zone burst=20 nodelay;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://grafana:3000;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prometheus.domain.com;

    ssl_certificate     /etc/letsencrypt/live/prometheus.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometheus.domain.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    allow 203.0.113.10/32;   # GANTI dengan IP admin/VPN
    deny all;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://prometheus:9090;
    }
}
