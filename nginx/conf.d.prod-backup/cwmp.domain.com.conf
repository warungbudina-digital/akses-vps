# GenieACS CWMP endpoint — https://cwmp.domain.com (menerima Inform dari CPE)
server {
    listen 80;
    listen [::]:80;
    server_name cwmp.domain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cwmp.domain.com;

    ssl_certificate     /etc/letsencrypt/live/cwmp.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cwmp.domain.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/cwmp.access.log json_combined;
    error_log  /var/log/nginx/cwmp.error.log warn;

    # Banyak CPE inform bersamaan (mis. setelah outage) -> rate limit lebih longgar
    limit_req zone=cwmp_zone burst=100 nodelay;

    # CPE lawas kadang kirim payload SOAP besar / lambat, timeout dilonggarkan
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 16m;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://genieacs-cwmp:7547;
    }
}
