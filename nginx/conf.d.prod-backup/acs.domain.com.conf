# GenieACS UI — https://acs.domain.com
server {
    listen 80;
    listen [::]:80;
    server_name acs.domain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name acs.domain.com;

    ssl_certificate     /etc/letsencrypt/live/acs.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acs.domain.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/acs.access.log json_combined;
    error_log  /var/log/nginx/acs.error.log warn;

    limit_req zone=general_zone burst=40 nodelay;
    limit_conn conn_limit_per_ip 20;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://genieacs-ui:3000;
    }
}
