<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input URL — viral pipeline</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --border:#2a2f3a; --text:#e6e8eb; --muted:#9aa3af;
          --accent:#4f8cff; --ok:#3ecf8e; --err:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin:16px 0 6px; }
  input[type=text], input[type=password], textarea, select {
    width:100%; padding:10px 12px; background:var(--card); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:15px; font-family:inherit;
  }
  textarea { resize:vertical; min-height:60px; }
  button { margin-top:20px; width:100%; padding:12px; border:none; border-radius:8px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #msg { margin-top:14px; font-size:14px; padding:10px 12px; border-radius:8px; display:none; }
  #msg.ok { display:block; background:rgba(62,207,142,.12); color:var(--ok); border:1px solid rgba(62,207,142,.3); }
  #msg.err { display:block; background:rgba(255,93,93,.12); color:var(--err); border:1px solid rgba(255,93,93,.3); }
  details { margin-top:28px; color:var(--muted); font-size:13px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Input URL video</h1>
  <p class="sub">Masukkan link video hasil pilahan sendiri. Masuk antrean <code>media.video_ingest</code>, dikuras otomatis tiap ±10 menit kalau analyzer aktif.</p>

  <form id="f">
    <label for="url">URL video</label>
    <input type="text" id="url" placeholder="https://..." autocomplete="off" required>

    <label for="category">Kategori</label>
    <select id="category">
      <option value="viral_video">viral_video</option>
      <option value="menuju_viral_video">menuju_viral_video</option>
    </select>

    <label for="note">Catatan (opsional)</label>
    <textarea id="note" placeholder="mis. referensi hook kuat, dari kompetitor X"></textarea>

    <button type="submit" id="btn">Masukkan ke antrean</button>
  </form>
  <div id="msg"></div>

  <details>
    <summary>Token akses</summary>
    <label for="token">Bearer token (disimpan di browser ini saja)</label>
    <input type="password" id="token" placeholder="tempel token sekali, lalu tersimpan">
  </details>

  <p class="sub" style="margin-top:28px;">Lihat antrean &amp; hasil: <a href="/">dashboard</a></p>
</div>

<script>
(function () {
  var TOKEN_KEY = "viral_dashboard_token";
  var tokenEl = document.getElementById("token");
  try { tokenEl.value = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var url = document.getElementById("url").value.trim();
    var category = document.getElementById("category").value;
    var note = document.getElementById("note").value.trim();
    var token = tokenEl.value.trim();
    var btn = document.getElementById("btn");
    var msg = document.getElementById("msg");
    msg.className = ""; msg.style.display = "none";

    if (!url) return;
    if (!token) {
      msg.textContent = "Isi token akses dulu (lihat bagian \"Token akses\").";
      msg.className = "err"; msg.style.display = "block";
      return;
    }
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}

    btn.disabled = true; btn.textContent = "Mengirim...";
    fetch("/api/enqueue", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ url: url, category: category, note: note })
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        btn.disabled = false; btn.textContent = "Masukkan ke antrean";
        if (res.status === 200 && res.body.ok) {
          msg.textContent = "Masuk antrean, id #" + res.body.id + ".";
          msg.className = "ok"; msg.style.display = "block";
          document.getElementById("url").value = "";
          document.getElementById("note").value = "";
        } else if (res.status === 401) {
          msg.textContent = "Token salah/belum diisi.";
          msg.className = "err"; msg.style.display = "block";
        } else {
          msg.textContent = (res.body && res.body.error) || "Gagal (tak diketahui).";
          msg.className = "err"; msg.style.display = "block";
        }
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = "Masukkan ke antrean";
        msg.textContent = "Gagal kontak server: " + e;
        msg.className = "err"; msg.style.display = "block";
      });
  });
})();
</script>
</body>
</html>
