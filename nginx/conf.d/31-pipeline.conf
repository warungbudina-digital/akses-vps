# Dashboard antrean & analisa viral pipeline (schema media.* DB-VPS) — https://pipeline.obc-crypto.com
# Statis (HTML self-contained di-generate ~/viral-pipeline/dashboard.py, di-copy ke
# nginx/dashboards/pipeline/ tiap regen). TLS publik ditangani Cloudflare edge.
server {
    listen 80;
    listen [::]:80;
    server_name pipeline.obc-crypto.com;
    include /etc/nginx/snippets/security-headers.conf;

    limit_req zone=general_zone burst=40 nodelay;
    limit_conn conn_limit_per_ip 20;

    root /usr/share/nginx/dashboards/pipeline;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # (2026-10-19) form input.html -> dashboard_api.py (backend host, bind ke
    # gateway docker 172.19.0.1 -- nginx jalan di container, 127.0.0.1 di sini
    # BUKAN host; pola sama persis chrome-vps-tunnel.service). Auth Bearer
    # token ditangani backend sendiri, bukan di nginx.
    location /api/ {
        proxy_pass http://172.19.0.1:8097/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # (2026-11-04) manual-fetch.html -> manual_fetch_api.py (backend TERPISAH,
    # port 8098 -- lihat plan crispy-mapping-cherny.md). nginx cocokkan
    # longest-prefix, jadi block ini menang atas /api/ di atas utk path ini,
    # terlepas urutan file. Auth Bearer ditangani backend sendiri (sama pola
    # /api/ di atas).
    location /api/manual-fetch/ {
        proxy_pass http://172.19.0.1:8098/api/manual-fetch/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
