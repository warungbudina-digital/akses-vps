# Dashboard antrean & analisa viral pipeline (schema media.* DB-VPS) — https://pipeline.obc-crypto.com
# Statis (HTML self-contained di-generate ~/viral-pipeline/dashboard.py, di-copy ke
# nginx/dashboards/pipeline/ tiap regen). TLS publik ditangani Cloudflare edge.
server {
    listen 80;
    listen [::]:80;
    server_name pipeline.obc-crypto.com;
    include /etc/nginx/snippets/security-headers.conf;

    limit_req zone=general_zone burst=40 nodelay;
    limit_conn conn_limit_per_ip 20;

    root /usr/share/nginx/dashboards/pipeline;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
