# GenieACS UI — https://acs.obc-crypto.com (lewat Cloudflare Tunnel;
# TLS publik ditangani Cloudflare edge, nginx cukup plain HTTP di belakangnya)
server {
    listen 80;
    listen [::]:80;
    server_name acs.obc-crypto.com;
    include /etc/nginx/snippets/security-headers.conf;


    limit_req zone=general_zone burst=40 nodelay;
    limit_conn conn_limit_per_ip 20;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://genieacs-ui:3000;
    }
}
