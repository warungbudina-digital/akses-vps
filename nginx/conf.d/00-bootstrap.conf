# Default/catch-all vhost — hanya untuk healthcheck lokal Docker
# (wget http://127.0.0.1/healthz tidak kirim Host header yang match
# server_name manapun, jadi jatuh ke default_server ini) dan menolak
# request dengan Host header tak dikenal. Traffic nyata masuk lewat
# cloudflared dengan Host header acs/cwmp/fs/api.obc-crypto.com yang
# match server_name spesifik di file lain, bukan file ini.
#
# http2 on di sini WAJIB match nilai di 10-api-grpc.conf (juga listen 80):
# h2c (cleartext HTTP/2) dinegosiasikan di level listen-socket sebelum nginx
# tahu Host header/server block mana yang akan menangani request, jadi kalau
# server block lain di port yang sama beda setting http2-nya, negosiasi h2c
# jadi tidak konsisten - inilah yang bikin grpc_pass di 10-api-grpc.conf gagal
# dengan "server closed the stream without sending trailers" (client makin
# lanjut ke HTTP/2 tapi socket-nya balik nge-treat sebagai HTTP/1.1).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    http2 on;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
