# Bootstrap HTTP-only config — dipakai SEMENTARA sebelum domain asli & TLS
# cert Let's Encrypt siap (lihat nginx/conf.d.prod-backup/ untuk config full
# production per-subdomain yang akan dipasang kembali begitu domain siap).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /acs/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://genieacs-ui:3000/;
    }

    location /cwmp/ {
        proxy_set_header Host $host;
        proxy_pass http://genieacs-cwmp:7547/;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_pass http://grpc-server:8443/;
    }
}
