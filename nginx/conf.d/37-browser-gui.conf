# GUI login browser .61 (gui-chromium, KasmVNC) — https://browser-gui.obc-crypto.com
#
# Backend = gui-chromium di .61 (Cloud Shell gogobuda65, WG 10.66.66.61:3000).
# nginx hub (app-net) menjangkau IP WG itu langsung (sudah diuji: 401 dari container).
# Satu-satunya jalur masuk: Cloudflare edge -> tunnel -> nginx ini.
#
# Auth SENGAJA memakai basic-auth BAWAAN KasmVNC (CUSTOM_USER/PASSWORD di
# gui-61/.env), BUKAN auth_basic nginx — sama seperti chrome-vps.obc-crypto.com,
# supaya tak ada 2 prompt login bersusun. Password acak di hub
# (~/.config/gui-61/credentials.env).
#
# security-headers.conf SENGAJA tidak di-include: CSP ketat mematahkan KasmVNC
# (WebAssembly + Web Worker untuk decode kanvas), sama alasannya dgn chrome-vps.
#
# WebSocket WAJIB (kanvas VNC), buffering off, timeout panjang (sesi GUI bisa nganggur).
server {
    listen 80;
    listen [::]:80;
    server_name browser-gui.obc-crypto.com;

    limit_req zone=general_zone burst=40 nodelay;
    limit_conn conn_limit_per_ip 20;

    location / {
        proxy_pass http://10.66.66.61:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
