# GenieACS File Server — https://fs.obc-crypto.com (firmware/config
# download, referenced dari Download RPC, backed GridFS di MongoDB)
server {
    listen 80;
    listen [::]:80;
    server_name fs.obc-crypto.com;
    include /etc/nginx/snippets/security-headers.conf;


    limit_req zone=general_zone burst=20 nodelay;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://genieacs-fs:7567;
    }
}
