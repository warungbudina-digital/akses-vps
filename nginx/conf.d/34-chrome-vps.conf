# CHROME-VPS (chromium-cookie-station) — GUI KasmVNC utk login manual akun
# + ekspor cookies.txt. https://chrome-vps.obc-crypto.com
#
# Backend BUKAN container di app-net ini -- KasmVNC-nya sendiri bind
# 127.0.0.1 SAJA di VM idcloudhost terpisah (CHROME-VPS, 10.122.31.254,
# tanpa IP publik). Satu-satunya jalur masuk: systemd unit
# chrome-vps-tunnel.service di HOST ini (SSH -L, bukan container) yang
# forward 172.19.0.1:13060 -> CHROME-VPS:127.0.0.1:3060, dibatasi ufw
# supaya cuma bisa diakses dari subnet app-net ini (172.19.0.0/16), bukan
# dari luar. Auth login = basic-auth BAWAAN KasmVNC sendiri (CUSTOM_USER/
# PASSWORD di .env chromium-cookie-station) -- SENGAJA tidak dobel dgn
# auth_basic nginx di sini, biar tak ada 2 prompt login bersusun.
#
# Kalau CHROME-VPS/profil balibruntattour mati, halaman ini akan gagal
# konek (proxy error) -- nyalakan dulu: dari hub jalankan
# akses-vps/backup/bring-up-chromevps.sh balibruntattour
server {
    listen 80;
    listen [::]:80;
    server_name chrome-vps.obc-crypto.com;
    # security-headers.conf SENGAJA TIDAK di-include di sini: CSP-nya
    # ("script-src 'self'" tanpa 'unsafe-eval'/'wasm-unsafe-eval', tanpa
    # worker-src) cocok utk dashboard statis tapi berisiko mematahkan
    # KasmVNC (client noVNC-nya pakai WebAssembly+Web Worker utk decode
    # video kanvas). TLS publik tetap ditangani Cloudflare edge seperti biasa.

    limit_req zone=general_zone burst=40 nodelay;
    limit_conn conn_limit_per_ip 20;

    location / {
        proxy_pass http://172.19.0.1:13060;
        proxy_http_version 1.1;
        # KasmVNC pakai WebSocket utk kanvas VNC -- WAJIB header Upgrade,
        # dan buffering/timeout longgar (sesi GUI bisa nganggur lama).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
