# MQTT over WebSocket — https://mqtt.domain.com (wss://mqtt.domain.com/mqtt)
server {
    listen 80;
    listen [::]:80;
    server_name mqtt.domain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mqtt.domain.com;

    ssl_certificate     /etc/letsencrypt/live/mqtt.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.domain.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/mqtt.access.log json_combined;
    error_log  /var/log/nginx/mqtt.error.log warn;

    limit_req zone=general_zone burst=40 nodelay;

    location /mqtt {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://mosquitto:9001;
        proxy_read_timeout 3600s;   # keep long-lived WS open
        proxy_send_timeout 3600s;
    }
}
