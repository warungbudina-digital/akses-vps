# GenieACS CWMP endpoint — https://cwmp.obc-crypto.com (menerima Inform
# dari CPE lewat Cloudflare Tunnel). Port 7547 tetap dibuka langsung juga
# (lihat docker-compose) untuk CPE yang tidak support SNI/TLS modern.
server {
    listen 80;
    listen [::]:80;
    server_name cwmp.obc-crypto.com;
    include /etc/nginx/snippets/security-headers.conf;


    # Banyak CPE inform bersamaan (mis. setelah outage) -> rate limit lebih longgar
    limit_req zone=cwmp_zone burst=100 nodelay;

    # CPE lawas kadang kirim payload SOAP besar / lambat, timeout dilonggarkan
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 16m;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://genieacs-cwmp:7547;
    }
}

# Akses langsung TR-069 tanpa lewat Cloudflare Tunnel/SNI - untuk CPE lawas
# yang tidak support SNI/TLS modern. Publik langsung lewat port 7547
# (docker-compose publish + UFW allow), bukan lewat cloudflared. Ini
# server block BARU - sebelumnya tidak ada listener nginx di 7547 sama
# sekali meski port-nya sudah di-publish/dibuka firewall (proxy_pass ke
# genieacs-cwmp:7547 sebelumnya cuma ada di bawah path /cwmp/ pada listener
# port 80/443, bukan listener 7547 tersendiri - jadi akses langsung ke
# 7547 sebenarnya sudah tidak pernah berfungsi, terverifikasi via curl
# langsung saat migrasi ini, bukan regresi dari perubahan ini).
server {
    listen 7547;
    listen [::]:7547;
    server_name _;
    include /etc/nginx/snippets/security-headers.conf;

    limit_req zone=cwmp_zone burst=100 nodelay;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 16m;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://genieacs-cwmp:7547;
    }
}
