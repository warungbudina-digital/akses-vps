# Dashboard generator script-editing VN (katalog+brief -> .vn-blueprint.json /
# .vn-recipe.md) — https://editor.obc-crypto.com
# Statis murni, generate 100% client-side (lihat nginx/dashboards/editor/app.js) —
# tidak ada backend/endpoint server untuk halaman ini. TLS publik ditangani
# Cloudflare edge. Password tunggal via auth_basic (single-user internal tool).
server {
    listen 80;
    listen [::]:80;
    server_name editor.obc-crypto.com;
    include /etc/nginx/snippets/security-headers.conf;

    limit_req zone=general_zone burst=40 nodelay;
    limit_conn conn_limit_per_ip 20;

    auth_basic           "editor.obc-crypto.com";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-editor;

    root /usr/share/nginx/dashboards/editor;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
