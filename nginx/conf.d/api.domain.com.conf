# gRPC / gRPC-Gateway — https://api.domain.com
server {
    listen 80;
    listen [::]:80;
    server_name api.domain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.domain.com;

    ssl_certificate     /etc/letsencrypt/live/api.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domain.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/api.access.log json_combined;
    error_log  /var/log/nginx/api.error.log warn;

    limit_req zone=api_zone burst=20 nodelay;
    limit_conn conn_limit_per_ip 30;

    # Native gRPC (HTTP/2 cleartext ke upstream, TLS sudah di-terminate di sini)
    location /device.v1.DeviceService/ {
        grpc_pass grpc://grpc-server:50051;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 60s;
        error_page 502 = /error502grpc;
    }

    # REST gateway (gRPC-Gateway) untuk klien non-gRPC
    location /v1/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://grpc-server:8443/v1/;
    }

    location = /error502grpc {
        internal;
        default_type application/json;
        return 502 '{"error":"upstream grpc unavailable"}';
    }

    location /healthz {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://grpc-server:8443/healthz;
        access_log off;
    }

    location /metrics {
        # batasi hanya untuk scraper Prometheus internal (network trust), bukan publik
        allow 172.20.0.0/24;
        deny all;
        proxy_pass http://grpc-server:8443/metrics;
    }
}
