# gRPC / gRPC-Gateway / MQTT-over-WebSocket — https://api.obc-crypto.com
# (lewat Cloudflare Tunnel; TLS publik ditangani Cloudflare edge)
server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name api.obc-crypto.com;
    include /etc/nginx/snippets/security-headers.conf;


    limit_req zone=api_zone burst=20 nodelay;
    limit_conn conn_limit_per_ip 30;

    # Native gRPC (h2c ke upstream — cloudflared ingress diset originRequest.http2Origin
    # supaya framing HTTP/2 tetap utuh ujung ke ujung sampai grpc-server)
    location /device.v1.DeviceService/ {
        grpc_pass grpc://grpc-server:50051;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 60s;
        error_page 502 = /error502grpc;
    }

    # Native gRPC untuk fleet pentest (Raspberry Pi dkk) - service terpisah
    # dari device.v1.DeviceService di atas, lihat pentest-grpc-server/
    location /pentest.v1.PentestFleetService/ {
        grpc_pass grpc://pentest-grpc-server:50052;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 60s;
        error_page 502 = /error502grpc;
    }

    # REST gateway (gRPC-Gateway) untuk klien non-gRPC
    location /v1/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://grpc-server:8443/v1/;
    }

    # REST fallback untuk PentestFleetService (sama alasan seperti /v1/
    # di atas - CF Tunnel Free plan tidak reliable untuk native gRPC trailer).
    # nginx otomatis pilih prefix location terpanjang yang cocok, jadi ini
    # menang atas /v1/ generik di atas walau urutan deklarasi lebih dulu.
    location /v1/pentest/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://pentest-grpc-server:8444/v1/pentest/;
    }

    # MQTT over WebSocket (mosquitto listener :9001, auth+ACL ditegakkan mosquitto sendiri)
    location /mqtt {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://mosquitto:9001;
        proxy_read_timeout 3600s;   # keep long-lived WS open
        proxy_send_timeout 3600s;
    }

    location = /error502grpc {
        internal;
        default_type application/json;
        return 502 '{"error":"upstream grpc unavailable"}';
    }

    location /healthz {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://grpc-server:8443/healthz;
        access_log off;
    }

    location /metrics {
        # batasi hanya untuk scraper Prometheus internal (network trust), bukan publik.
        # nginx & prometheus sama-sama di app-net (172.19.0.0/16) - BUKAN
        # data-net (172.20.0.0/16, prefix sebelumnya juga salah /24 padahal
        # /16). Subnet ini auto-assign Docker, belum di-pin eksplisit di
        # compose - kalau network di-recreate total, cek ulang dengan
        # `docker network inspect akses-vps_app-net`.
        allow 172.19.0.0/16;
        deny all;
        proxy_pass http://grpc-server:8443/metrics;
    }
}
