# gRPC / gRPC-Gateway / MQTT-over-WebSocket — https://103-217-144-104.sslip.io
server {
    listen 80;
    listen [::]:80;
    server_name 103-217-144-104.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 103-217-144-104.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/103-217-144-104.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103-217-144-104.sslip.io/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;


    limit_req zone=api_zone burst=20 nodelay;
    limit_conn conn_limit_per_ip 30;

    # Native gRPC (HTTP/2 cleartext ke upstream, TLS sudah di-terminate di sini)
    location /device.v1.DeviceService/ {
        grpc_pass grpc://grpc-server:50051;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 60s;
        error_page 502 = /error502grpc;
    }

    # REST gateway (gRPC-Gateway) untuk klien non-gRPC
    location /v1/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://grpc-server:8443/v1/;
    }

    # MQTT over WebSocket (mosquitto listener :9001, auth+ACL ditegakkan mosquitto sendiri)
    location /mqtt {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://mosquitto:9001;
        # mosquitto.conf max_keepalive=120s - timeout proxy harus lebih longgar dari itu
        # supaya nginx tidak memutus koneksi WS yang idle antar PINGREQ client.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /error502grpc {
        internal;
        default_type application/json;
        return 502 '{"error":"upstream grpc unavailable"}';
    }

    location /healthz {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://grpc-server:8443/healthz;
        access_log off;
    }

    location /metrics {
        # batasi hanya untuk scraper Prometheus internal (network trust), bukan publik
        allow 172.20.0.0/24;
        deny all;
        proxy_pass http://grpc-server:8443/metrics;
    }
}
