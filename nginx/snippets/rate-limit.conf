# Referensi zona rate-limit yang didefinisikan di nginx.conf (http block):
#   limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=cwmp_zone:10m rate=50r/s;
#   limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
#
# Zona harus didefinisikan di scope `http{}` (sekali saja), lalu dipakai di
# tiap server/location dengan `limit_req zone=<nama> burst=<n> nodelay;`
# Sesuaikan rate per endpoint:
#   - general_zone : traffic UI/browser biasa
#   - api_zone     : gRPC/REST, lebih ketat karena rawan abuse
#   - cwmp_zone    : TR-069 Inform, lebih longgar karena banyak CPE serentak
