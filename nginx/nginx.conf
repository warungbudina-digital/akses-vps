user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging (JSON, mudah di-parse Promtail/Loki) ----
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    access_log  /var/log/nginx/access.log json_combined;

    # ---- Performance basics ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript application/json application/xml
        text/css text/javascript text/plain text/xml
        application/x-yaml application/grpc-web+proto;

    # ---- Proxy buffers (di-tune untuk mixed payload kecil-besar) ----
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_temp_file_write_size 64k;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 64m;
    client_body_buffer_size 128k;

    # ---- Rate limiting zones ----
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=cwmp_zone:10m rate=50r/s; # banyak CPE bisa inform bersamaan
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Tidak ada blok TLS di sini - nginx di deployment ini tidak pernah
    # terminate TLS sama sekali (semua server block di conf.d/ pakai
    # `listen 80`/`listen 7547` plain, tidak ada `listen ssl`). TLS publik
    # untuk domain UI/API ditangani Cloudflare Tunnel di edge; jalur CWMP
    # langsung :7547 memang plain HTTP by design untuk kompatibilitas CPE
    # lawas. Lihat docs/06-component-explanation.md komponen 4 dan
    # docs/08-security-hardening-checklist.md bagian TLS. (ssl_protocols/
    # ssl_ciphers/ssl_stapling/resolver yang sebelumnya ada di sini sudah
    # dihapus - inert, peninggalan desain TLS-di-nginx yang lama.)

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
